<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registration and login page for Stradivarius Mega Silkway">
    <meta name="author" content="Auyezkhan Alina &amp; Kharagussova Zhamilya">
    <title>Stradivarius Mega Silkway-Registration</title>
<!-- Bootstrap 5.3.3 via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/alina.css">
</head>
<body>

    <header class="bg-dark text-white text-center text-lg-start py-5">
        <div class="container">
            <h1 class="display-5">Choose your own style</h1>
        </div>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" id="site-nav">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Stradivarius</a>
            <div class="d-flex align-items-center gap-1 ms-auto order-lg-last">
                <a class="nav-cart p-2" href="cart.html" id="nav-cart-link" aria-label="Cart">
                    <img src="images/cart_photo.png" alt="Cart" class="nav-cart-icon" id="nav-cart-icon" width="24" height="24">
                </a>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="registration.html">Sign up or Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about-stradivarius.html">About the Store</a></li>
                    <li class="nav-item"><a class="nav-link" href="visit-and-feedback.html">Visit &amp; Feedback</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalog.html">Collection</a></li>
                    <li class="nav-item"><a class="nav-link" href="care.html">Style &amp; Care</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
    <!-- .container-fluid: full-bleed split, unlike other pages' .container. -->
        <div class="container-fluid" id="hero-registration">
            <div class="row hero-row">

                <div class="col-12 col-lg-6 p-0">
                    <img class="w-100 h-100 object-fit-cover" src="images/stradivarius_exterier.jpg" alt="Model wearing a Stradivarius outfit">
                </div>

                <div class="col-12 col-lg-6 bg-white p-4 p-lg-5 d-flex flex-column justify-content-center">

                    <h2>Sign Up</h2>
                    <form id="registration" action="registration.html" method="post">
                        <fieldset>
                            <legend class="h6 text-muted">Create a new account</legend>

                            <div class="mb-3">
                                <label for="reg-name" class="form-label">Full Name:</label>
                                <input type="text" class="form-control" id="reg-name" name="reg-name" required>
                            </div>

                            <div class="mb-3">
                                <label for="reg-email" class="form-label">Email:</label>
                                <input type="email" class="form-control" id="reg-email" name="reg-email" required>
                            </div>

                            <div class="mb-3">
                                <label for="reg-password" class="form-label">Password:</label>
                                <input type="password" class="form-control" id="reg-password" name="reg-password" minlength="8" required>
                            </div>

                            <div class="mb-3">
                                <label for="reg-confirm-password" class="form-label">Confirm Password:</label>
                                <input type="password" class="form-control" id="reg-confirm-password" name="reg-confirm-password" minlength="8" required>
                            </div>

                            <div class="mb-3">
                                <label for="reg-birthdate" class="form-label">Date of Birth:</label>
                                <input type="date" class="form-control" id="reg-birthdate" name="reg-birthdate">
                            </div>

                            <div class="form-check mb-3">
                                <input type="checkbox" class="form-check-input" id="reg-newsletter" name="reg-newsletter">
                                <label class="form-check-label" for="reg-newsletter">Subscribe to newsletter and promotions</label>
                            </div>

                            <button type="submit" class="btn btn-dark w-100">Sign Up</button>
                            <button type="button" class="btn btn-outline-dark w-100 mt-2" disabled>Continue with Google</button>
                        </fieldset>
                    </form>

                    <h2 class="mt-4">Login</h2>
                    <form action="registration.html" method="post">
                        <fieldset>
                            <legend class="h6 text-muted">Already have an account?</legend>

                            <div class="mb-3">
                                <label for="login-email" class="form-label">Email:</label>
                                <input type="email" class="form-control" id="login-email" name="login-email" required>
                            </div>

                            <div class="mb-3">
                                <label for="login-password" class="form-label">Password:</label>
                                <input type="password" class="form-control" id="login-password" name="login-password" required>
                            </div>

                            <button type="submit" class="btn btn-outline-dark w-100">Login</button>
                        </fieldset>
                    </form>
                    <div id="form-response-message" class="mt-3"></div>
                </div>
            </div>
        </div>
    </main>

    <a href="visit-and-feedback.html" class="btn btn-dark rounded-pill shadow position-fixed bottom-0 end-0 m-4">Contact us</a>

    <footer class="border-top py-3 text-center text-muted small">
        <div class="container">
            <p class="mb-0">&copy; 2026. Kharagussova Zhamilya, Auyezkhan Alina. Student project.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
